name: Actualizar datos

on:
  schedule:
    # Actualizacion completa. Horas en UTC (Argentina = UTC-3): 08, 12, 16, 19 y 22 hs de Argentina
    - cron: "0 11,15,19,22 * * *"
    - cron: "0 1 * * *"
    # Alineaciones: cada 15 minutos revisa si hay partidos por empezar (si no hay, no hace nada)
    - cron: "7,22,37,52 * * * *"
  # boton "Run workflow" (a mano) y disparador externo de cron-job.org
  workflow_dispatch:
    inputs:
      modo:
        description: "completa o alineaciones"
        required: false
        default: completa

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos y calcular
        run: |
          if [ "${{ github.event.schedule }}" = "7,22,37,52 * * * *" ] || [ "${{ inputs.modo }}" = "alineaciones" ]; then
            python scripts/actualizar.py --alineaciones
            python scripts/nba.py --bajas
            python scripts/f1.py --sanciones
          else
            python scripts/actualizar.py
            python scripts/nba.py
            python scripts/f1.py
          fi
      - name: Avisos de Telegram
        run: python scripts/avisos.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DLT_FUTBOL_BOT }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      - name: Guardar cambios
        run: |
          git config user.name "DLT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
